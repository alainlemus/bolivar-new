; Un solo contenedor: nginx + php-fpm. Supervisor los reinicia si se caen.
; (Funeraria García de Bolívar no usa colas ni tareas programadas: los correos se envían en
; la misma petición. Si algún día las usa, agrega aquí un [program:queue] con
; `php artisan queue:work` y un [program:scheduler] con `php artisan schedule:work`.)
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:php-fpm]
command=php-fpm -F
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
