# Nginx delante de PHP-FPM. Dokploy (Traefik) termina el HTTPS y reenvía aquí por
# HTTP; los encabezados X-Forwarded-* llegan tal cual a Laravel (trustProxies('*')).
server {
    listen __PORT__ default_server;
    server_name _;

    root /var/www/html/public;
    index index.php;
    charset utf-8;

    # Igual que upload_max_filesize/post_max_size de PHP.
    client_max_body_size 20M;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # Assets de Vite: el nombre lleva hash, se pueden cachear para siempre.
    location /build/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Imágenes del sitio (public/images).
    location /images/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # Imágenes subidas desde el admin (symlink public/storage).
    location /storage/ {
        expires 7d;
        try_files $uri =404;
    }

    # Todo lo demás pasa por Laravel si no es un archivo real (sitemap.xml, robots.txt
    # y version.json son rutas de Laravel: no agregar un location por extensión).
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;
        fastcgi_read_timeout 300;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
